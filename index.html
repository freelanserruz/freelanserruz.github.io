<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali | Telegram bot va sayt yaratish</title>
<meta name="description" content="Python dasturchi Ali: Telegram botlar va saytlar yaratish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--s1:#eef0f3;--s2:#d3d7dd;--s3:#9aa1ac;--s4:#5b626d;--ink:#000}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 1rem/1.6 Onest,system-ui,sans-serif;color:var(--ink);background:var(--w);overflow-x:hidden}
h1,h2,h3,.logo{font-family:Unbounded,Onest,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--s3),var(--ink));z-index:50}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem clamp(1rem,5vw,3rem);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--s2)}
.logo{font-weight:800;font-size:1.15rem;text-decoration:none;letter-spacing:.02em}
nav{display:flex;gap:1.6rem}
nav a{text-decoration:none;color:var(--s4);font-weight:500}
nav a:hover{color:var(--ink)}
.lang{display:flex;gap:.25rem}
.lang button{font:600 .8rem Onest,sans-serif;padding:.35rem .6rem;border:1px solid var(--s2);background:var(--w);color:var(--s4);cursor:pointer;border-radius:99px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--w);border-color:var(--ink)}
section{padding:clamp(3.5rem,9vw,7rem) clamp(1rem,5vw,3rem);max-width:1180px;margin:0 auto;position:relative}
h2{font-size:clamp(1.6rem,4vw,2.5rem);font-weight:600;margin-bottom:2rem;letter-spacing:-.01em}
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#sky img{position:absolute;left:0;top:0;mix-blend-mode:multiply;will-change:transform;opacity:.85}
main,footer{position:relative;z-index:1}
.ord{max-width:640px}
/* hero */
.hero{display:flex;align-items:center;min-height:80vh}.hero>div:not(.jp){max-width:760px}
.hero h1{font-size:clamp(2rem,5.4vw,4rem);line-height:1.08;font-weight:800;letter-spacing:-.03em}
.hero p{margin:1.4rem 0 2rem;color:var(--s4);max-width:46ch;font-size:1.08rem}
.btn{display:inline-block;padding:.9rem 1.6rem;border-radius:99px;font:600 .95rem Onest,sans-serif;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--w);cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--w);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--w)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.card{position:relative;padding:2rem 1.8rem;border:1px solid var(--s2);border-radius:6px;background:linear-gradient(160deg,var(--w),var(--s1))}
.card h3{font-size:1.15rem;margin-bottom:.6rem}
.card p{color:var(--s4)}
.orn{position:absolute;width:104px;height:137px;background:var(--corner) center/contain no-repeat;pointer-events:none;mix-blend-mode:multiply}
.gl{position:absolute;width:46px;height:46px;background:var(--star4) center/contain no-repeat;mix-blend-mode:multiply;pointer-events:none;animation:glint 3.6s ease-in-out infinite}
.gl.tr{top:14px;right:14px}.gl.bl{bottom:14px;left:14px;animation-delay:1.8s}
.skull{display:block;width:150px;height:150px;margin:0 auto 1rem;background:var(--skull) center/contain no-repeat}
@keyframes glint{0%,100%{transform:scale(.8) rotate(0);filter:brightness(1)}50%{transform:scale(1.2) rotate(45deg);filter:brightness(1.35) contrast(1.15)}}
.pc{position:absolute;width:90px;height:119px;background:var(--corner) center/contain no-repeat;mix-blend-mode:multiply;opacity:.85}
.pc.tl{top:60px;left:6px}.pc.bl{bottom:6px;left:6px;transform:scaleY(-1)}.pc.br{bottom:6px;right:6px;transform:scale(-1,-1)}
.col{position:absolute;right:0;top:0;width:min(36vw,400px);aspect-ratio:300/767;background:var(--collage) top right/contain no-repeat;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.orn.tl{top:-1px;left:-1px}
.orn.br{bottom:-1px;right:-1px;transform:rotate(180deg)}
.proj{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:center;padding:2.6rem 2.2rem}
.proj h3{font-size:1.6rem}
.proj p{margin:.6rem 0 0;max-width:52ch}
/* reviews */
.rev{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:2rem;align-items:start}
form{display:grid;gap:.8rem}
input,textarea{width:100%;font:inherit;padding:.8rem 1rem;border:1px solid var(--s2);border-radius:6px;background:var(--w);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.rate{display:flex;gap:.2rem}
.rate button{font-size:1.6rem;line-height:1;background:none;border:0;cursor:pointer;color:var(--s2)}
.rate button.on{color:var(--ink)}
.note{font-size:.9rem;color:var(--s4);min-height:1.4em}
#list{display:grid;gap:.9rem}
.item{padding:1.1rem 1.3rem;border:1px solid var(--s2);border-radius:6px;background:var(--s1)}
.item b{font-weight:600}
.item .st{letter-spacing:.15em;margin-left:.5rem}
.item small{display:block;color:var(--s3);margin-top:.5rem}
.item p{margin-top:.3rem;overflow-wrap:anywhere}
.del{margin-top:.6rem;font:600 .8rem Onest,sans-serif;padding:.3rem .8rem;border:1px solid var(--ink);background:var(--w);border-radius:99px;cursor:pointer}
.empty{color:var(--s4);padding:1.4rem;border:1px dashed var(--s3);border-radius:6px}
/* contact */
.contact{text-align:center}
.contact .tg{font:800 clamp(1.8rem,6vw,3.4rem)/1.1 Unbounded,sans-serif;text-decoration:none;display:inline-block;margin:.4rem 0 1.6rem;background:linear-gradient(100deg,var(--s4),var(--ink) 40%,var(--s3) 70%,var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{padding:2rem;text-align:center;color:var(--s3);font-size:.9rem;background:var(--w);border-top:1px solid var(--s2)}
/* admin */
.hid{position:fixed;left:.7rem;bottom:.7rem;width:30px;height:30px;padding:0;border:0;background:none;opacity:.18;cursor:pointer;z-index:45}
.hid:hover,.hid:focus-visible{opacity:.7}
dialog{border:1px solid var(--ink);border-radius:8px;padding:1.6rem;width:min(92vw,340px);margin:auto}
dialog::backdrop{background:rgba(255,255,255,.7);backdrop-filter:blur(4px)}
dialog h3{margin-bottom:1rem;font-size:1.05rem}
.bar2{position:sticky;top:60px;z-index:30;display:none;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem clamp(1rem,5vw,3rem);background:var(--ink);color:var(--w);font-size:.9rem}
.bar2.on{display:flex}
.bar2 button{background:var(--w);color:var(--ink);border:0;border-radius:99px;padding:.3rem .9rem;font:600 .8rem Onest,sans-serif;cursor:pointer}
@media(max-width:820px){.hero,.rev{grid-template-columns:1fr}.hero{min-height:0}nav{display:none}.proj{grid-template-columns:1fr}.col{opacity:.3;width:150px}.pc{width:56px;height:74px}}
@media(prefers-reduced-motion:reduce){.gl{animation:none}html{scroll-behavior:auto}}
</style>
</head>

</main>

</dialog>

 h1:'I build Telegram bots and websites',
 sub:'I’m Ali, a Python developer. I make bots and sites for your business: simple, fast and clear.',
 cta:'Message on Telegram',cta2:'See the project',
 s_t:'What I do',s1t:'Telegram bots',s1d:'Bots that take orders, track stock and send notifications.',
 s2t:'Websites',s2d:'Business-card and rental pages that work well on a phone.',
 p_t:'Project',p_d:'A new design for a daily-rental website in Tashkent.',p_b:'Open the site',
 r_t:'Reviews',r_name:'Your name',r_text:'Write your review',r_send:'Send review',
 r_empty:'No reviews yet. Be the first to write one.',r_thanks:'Review added.',r_wait:'Please wait a moment before the next review.',r_pick:'Pick a rating.',r_err:'Could not send. Try again.',
 c_t:'Contact',c_copy:'Copy',c_done:'Copied',
 a_t:'Admin panel',a_pass:'Password',a_in:'Sign in',a_bad:'Wrong password.',a_out:'Sign out',a_del:'Delete',a_on:'Admin mode: you can delete reviews',a_local:'Firebase is not connected: reviews are stored in this browser only.'}
};
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('lang')||'uz'; if(!T[lang])lang='uz';
let admin=false, items=[], rating=0, db=null;

function setLang(l){
  lang=l;store.set('lang',l);document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  $('#admtxt').textContent=T[l].a_on+(db?'':' — '+T[l].a_local);
  render();
}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

/* progress bar */
addEventListener('scroll',()=>{const h=document.documentElement;$('#bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});

/* copy */
$('#cp').onclick=async()=>{
  try{await navigator.clipboard.writeText('@ugahub')}catch(e){}
  const b=$('#cp');b.textContent=T[lang].c_done;setTimeout(()=>b.textContent=T[lang].c_copy,1600);
};

/* rating */
const rate=$('#rate');
for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('role','radio');b.setAttribute('aria-label',i+'/5');
  b.onclick=()=>{rating=i;[...rate.children].forEach((x,j)=>x.classList.toggle('on',j<i))};rate.append(b)}

/* reviews: Firebase (shared) or localStorage (one browser) */
if(FIREBASE_CONFIG && window.firebase){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();}
function fmt(ts){const d=ts&&ts.toDate?ts.toDate():new Date(ts||Date.now());return d.toLocaleDateString(lang==='uz'?'uz-UZ':lang==='ru'?'ru-RU':'en-GB')}
function loadLocal(){try{items=JSON.parse(store.get('reviews')||'[]')}catch(e){items=[]}render()}
if(db){db.collection('reviews').orderBy('ts','desc').limit(50).onSnapshot(s=>{items=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{})}
else loadLocal();

function render(){
  const box=$('#list');box.textContent='';
  if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent=T[lang].r_empty;box.append(p);return}
  items.forEach(r=>{
    const d=document.createElement('div');d.className='item';
    const n=document.createElement('b');n.textContent=r.name;
    const s=document.createElement('span');s.className='st';s.textContent='★'.repeat(r.rating||0);
    const p=document.createElement('p');p.textContent=r.text;
    const m=document.createElement('small');m.textContent=fmt(r.ts);
    d.append(n,s,p,m);
    if(admin){const x=document.createElement('button');x.className='del';x.textContent=T[lang].a_del;x.onclick=()=>remove(r.id);d.append(x)}
    box.append(d);
  });
}
async function remove(id){
  if(!admin)return;
  if(db){try{await db.collection('reviews').doc(id).delete()}catch(e){}}
  else{items=items.filter(r=>r.id!==id);store.set('reviews',JSON.stringify(items));render()}
}
$('#f').onsubmit=async e=>{
  e.preventDefault();const note=$('#note'),t=T[lang];
  if(!rating){note.textContent=t.r_pick;return}
  const last=+store.get('lastRev')||0;
  if(Date.now()-last<30000){note.textContent=t.r_wait;return}
  const rec={name:$('#nm').value.trim().slice(0,40),text:$('#tx').value.trim().slice(0,400),rating};
  if(!rec.name||!rec.text)return;
  try{
    if(db){rec.ts=firebase.firestore.FieldValue.serverTimestamp();await db.collection('reviews').add(rec)}
    else{rec.ts=Date.now();rec.id='l'+rec.ts;items.unshift(rec);store.set('reviews',JSON.stringify(items));render()}
    store.set('lastRev',Date.now());note.textContent=t.r_thanks;
    $('#f').reset();rating=0;[...rate.children].forEach(x=>x.classList.remove('on'));
  }catch(err){note.textContent=t.r_err}
};

/* hidden admin */
const dlg=$('#adm');
$('#hid').onclick=()=>{if(admin)return;$('#an').textContent='';$('#ap').value='';dlg.showModal();$('#ap').focus()};
$('#af').onsubmit=e=>{
  if($('#ap').value===ADMIN_PASS){admin=true;$('#bar2').classList.add('on');render()}
  else{e.preventDefault();$('#an').textContent=T[lang].a_bad}
};
$('#out').onclick=()=>{admin=false;$('#bar2').classList.remove('on');render()};

/* order form */
$('#of').onsubmit=async e=>{
  e.preventDefault();const t=T[lang],note=$('#onote');
  const d={name:$('#on').value.trim(),phone:$('#op').value.trim(),email:$('#oe').value.trim(),message:$('#om').value.trim()};
  if(!d.name||!d.phone||!d.message)return;
  if(ORDER_KEY){
    try{
      const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
        body:JSON.stringify({access_key:ORDER_KEY,subject:'Yangi buyurtma / New order',...d})});
      if(!(await r.json()).success)throw 0;
      note.textContent=t.o_ok;$('#of').reset();
    }catch(err){note.textContent=t.o_err}
  }else{
    const txt=`${d.name}\n${d.phone}${d.email?'\n'+d.email:''}\n${d.message}`;
    try{await navigator.clipboard.writeText(txt)}catch(err){}
    window.open('https://t.me/ugahub?text='+encodeURIComponent(txt),'_blank','noopener');
    note.textContent=t.o_tg;
  }
};

/* flying stars in the background: drift with scroll, spin faster when scrolling fast */
(function(){
  const sky=$('#sky'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cfg=[[.03,.12,56,.30,1,1],[.93,.50,44,.22,-1,2],[.06,.62,38,.40,-1,2],[.90,.85,60,.18,1,1],[.11,.92,34,.45,1,2]];
  let W=innerWidth,H=innerHeight;
  const st=cfg.map(c=>{const im=document.createElement('img');im.src=IMG[c[5]===1?'star4':'star5'];im.alt='';im.width=c[2];im.draggable=false;sky.append(im);return{im,x:c[0],y:c[1],s:c[2],d:c[3],r:c[4],a:Math.random()*360}});
  addEventListener('resize',()=>{W=innerWidth;H=innerHeight});
  let last=scrollY,vel=0;
  function draw(){
    const y=scrollY,span=H+300;
    st.forEach(o=>{
      const py=(((o.y*H-y*o.d)%span)+span)%span-150,px=o.x*(W-o.s);
      o.im.style.transform=`translate3d(${px}px,${py}px,0) rotate(${o.a}deg)`;
    });
  }
  function tick(){
    const y=scrollY;vel+=(Math.min(Math.abs(y-last),80)-vel)*.12;last=y;
    st.forEach(o=>{o.a+=o.r*(.05+vel*.16)*(.7+o.d)});
    draw();requestAnimationFrame(tick);
  }
  still?draw():requestAnimationFrame(tick);
})();

setLang(lang);
</script>
</body>
</html>
