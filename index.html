var root=document.getElementById('ali'),chat=document.getElementById('chat'),lang='uz',timer;
try{var s=localStorage.getItem('ali_lang');if(D[s])lang=s}catch(e){}

function playChat(){
  clearTimeout(timer);
  var top=chat.firstChild;chat.innerHTML='';chat.appendChild(top);
  var L=D[lang].chat,i=0;
  (function next(){
    if(i>=L.length)return;
    var d=document.createElement('div');d.className='m '+(i%2?'b':'u');
    if(i==3||i==4){d.className='m '+(i==3?'b':'u')}
    d.textContent=L[i];chat.appendChild(d);i++;
    timer=setTimeout(next,1300);
  })();
}
function setLang(l){
  lang=l;
  try{localStorage.setItem('ali_lang',l)}catch(e){}
  root.querySelectorAll('[data-t]').forEach(function(el){var v=D[l][el.getAttribute('data-t')];if(v)el.textContent=v});
  root.querySelectorAll('[data-l]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===l)});
  document.getElementById('ok').textContent='';
  playChat();
}
root.querySelectorAll('[data-l]').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-l'))})});
setLang(lang);

/* Orqa fon */
var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,P=[],still=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();addEventListener('resize',size);
for(var k=0;k<60;k++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4});
var lastY=scrollY,boost=0;
addEventListener('scroll',function(){boost=Math.min(6,Math.abs(scrollY-lastY)*.15);lastY=scrollY});
function mix(a,b,t){return Math.round(a+(b-a)*t)}
function draw(){
  x.clearRect(0,0,W,H);
  var max=document.documentElement.scrollHeight-H||1,t=Math.min(1,scrollY/max);
  var col=mix(42,255,t)+','+mix(171,122,t)+','+mix(238,107,t);
  boost*=.92;
  for(var a=0;a<P.length;a++){
    var p=P[a];
    if(!still){p.x+=p.vx*(1+boost);p.y+=p.vy*(1+boost)-boost*.15}
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    x.beginPath();x.arc(p.x,p.y,2,0,6.28);x.fillStyle='rgba('+col+',.7)';x.fill();
    for(var b=a+1;b<P.length;b++){
      var q=P[b],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
      if(d<16000){x.strokeStyle='rgba('+col+','+(.22*(1-d/16000))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}
    }
  }
  requestAnimationFrame(draw);
}
draw();
